<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Employee Directory | IPEOT</title>
    
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#3F51B5">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="IPEOT Directory">
    <link rel="apple-touch-icon" href="icons/icon-192.png">

    <!-- SEO -->
    <meta name="description" content="Official Employee Directory for IPEOT - Access contact information and department details anywhere.">
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Styles -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- Header -->
        <header class="main-header">
            <div class="header-content">
                <button id="menuBtn" class="icon-btn" aria-label="Menu">
                    <svg viewBox="0 0 24 24"><path d="M3 18h18v-2H3v2zm0-5h18v-2H3v2zm0-7v2h18V6H3z"/></svg>
                </button>
                <h1>Home</h1>
                <div class="header-actions">
                    <button id="refreshBtn" class="icon-btn" aria-label="Refresh">
                        <svg viewBox="0 0 24 24"><path d="M17.65 6.35C16.2 4.9 14.21 4 12 4c-4.42 0-7.99 3.58-7.99 8s3.57 8 7.99 8c3.73 0 6.84-2.55 7.73-6h-2.08c-.82 2.33-3.04 4-5.65 4-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
                    </button>
                </div>
            </div>
        </header>

        <!-- Search Bar -->
        <section class="search-section">
            <div class="search-container">
                <div class="search-wrapper">
                    <svg class="search-icon" viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
                    <input type="text" id="searchInput" placeholder="Search by name, CPF, or department..." autocomplete="off">
                </div>
                <button id="filterBtn" class="icon-btn" aria-label="Filter">
                    <svg viewBox="0 0 24 24"><path d="M10 18h4v-2h-4v2zM3 6v2h18V6H3zm3 7h12v-2H6v2z"/></svg>
                </button>
            </div>
        </section>

        <!-- Employee List -->
        <main class="employee-list-container">
            <div id="employeeList" class="employee-list">
                <!-- Skeleton Loader -->
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
                <div class="skeleton-card"></div>
            </div>
        </main>

        <!-- Tabs Navigation (Bottom) -->
        <nav class="bottom-nav">
            <button class="nav-item active" data-tab="home">
                <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
                <span>Home</span>
            </button>
            <button class="nav-item" data-tab="bookmarks">
                <svg viewBox="0 0 24 24"><path d="M17 3H7c-1.1 0-1.99.9-1.99 2L5 21l7-3 7 3V5c0-1.1-.9-2-2-2z"/></svg>
                <span>Bookmarks</span>
            </button>
        </nav>

        <!-- Modals -->
        <div id="detailModal" class="modal detail-modal">
            <div class="modal-content detail-content">
                <button class="close-btn" onclick="closeModal('detailModal')">
                    <svg viewBox="0 0 24 24"><path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/></svg>
                </button>
                <div id="detailBody">
                    <!-- Dynamic Content -->
                </div>
            </div>
        </div>

        <div id="aboutModal" class="modal">
            <div class="modal-content">
                <h2>About</h2>
                <p>Made with Love, for IPEOT, by APS</p>
                <button class="btn btn-primary" onclick="closeModal('aboutModal')">OK</button>
            </div>
        </div>

        <div id="toast" class="toast"></div>
    </div>

    <!-- Scripts -->
    <script src="app.js" type="module"></script>
</body>
</html>
